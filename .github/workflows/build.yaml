name: Build
on:
  push:
    branches:
      - '*/*'
  pull_request:
jobs:
  publish:
    name: Build UI
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v6
        with:
          cache: 'pnpm'
          node-version: 24
      - run: pnpm install
      - run: pnpm run build
