name: Build
on:
  push:
    branches:
      - '*/*'
  pull_request:
jobs:
  publish:
    name: Build UI
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5.0.0
        with:
          cache: 'npm'
          node-version: '16'
      - run: npm ci
      - run: npm run build
